[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "league-team-bot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["league_team_bot*"]

[project.optional-dependencies]
runtime = ["omegaconf", "discord.py", "pymongo", "requests", "multi-elo"]
